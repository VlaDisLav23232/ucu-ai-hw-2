run_id: pipeline-final
unit: U4.8
family: pipeline
exp: final
parent_run: rtdetr-e0
hypothesis: Cross-family Weighted Box Fusion (YOLO11s @1600/1280 + RT-DETR-L nq=300/600)
  followed by temporal tracklet rescoring and linear gap propagation yields cumulative
  holdout AP gains over every single model.
seed: 42
models:
- run_id: yolo-e0
  weights: checkpoints/yolo-e0_best.pt
  imgsz: 1280
  batch: 4
  wbf_weight: 1.0
- run_id: yolo-e1
  weights: checkpoints/yolo-e1_best.pt
  imgsz: 1600
  batch: 2
  wbf_weight: 1.5
- run_id: yolo-e2
  weights: checkpoints/yolo-e2_best.pt
  imgsz: 1280
  batch: 4
  wbf_weight: 0.8
- run_id: rtdetr-e0
  weights: checkpoints/rtdetr-e0_best.pt
  imgsz: 1280
  batch: 2
  wbf_weight: 2.5
- run_id: rtdetr-e1
  weights: checkpoints/rtdetr-e1_best.pt
  imgsz: 1280
  batch: 2
  wbf_weight: 2.2
- run_id: rtdetr-e2
  weights: checkpoints/rtdetr-e2_best.pt
  imgsz: 1280
  batch: 2
  wbf_weight: 1.8
fusion:
  method: wbf
  iou_thr: 0.55
  skip_box_thr: 0.001
  conf_type: avg
  max_det: 500
temporal:
  method: rescore
  iou_link: 0.45
  alpha: 0.7
  topk_ratio: 0.5
  enable_propagation: true
  prop_min_score: 0.25
  prop_min_len: 3
  max_gap: 2
  gap_decay: 0.85
  single_frame_decay: 0.96
use_class_wbf: false
use_smooth_boxes: true
