run_id: retina-smoke-local
unit: U2.0
family: retinanet
exp: smoke
parent_run: ''
hypothesis: Verify RetinaNet training loop, k-means anchors, focal loss + matcher
  patch on 20 cached frames.
seed: 42
cache: k5_drop_L1920
k: 5
imgsz: 640
min_size: 384
max_size: 640
num_classes: 9
trainable_backbone_layers: 3
max_train_images: 20
val_on_train: true
batch: 2
workers: 2
epochs: 6
time_budget_h: 0.15
optimizer: sgd
lr: 0.005
momentum: 0.9
weight_decay: 0.0001
warmup_epochs: 1.0
grad_clip_norm: 10.0
use_kmeans_anchors: true
focal_alpha: 0.25
focal_gamma: 1.5
fg_iou_thresh: 0.4
bg_iou_thresh: 0.3
box_loss_type: giou
augmentation:
  hflip: 0.0
  scale_min: 1.0
  scale_max: 1.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
inference:
  conf_thresh: 0.001
  nms_iou: 0.6
  max_det: 500
  slim_conf_thresh: 0.05
