[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdet"
version = "0.1.0"
description = "Multiple-Object Video Detection (VisDrone-VID) — UCU AI 2026 HW2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "faster-coco-eval>=1.6.5",
    "pycocotools>=2.0.7",
    "ensemble-boxes>=1.0.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.3.0",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
