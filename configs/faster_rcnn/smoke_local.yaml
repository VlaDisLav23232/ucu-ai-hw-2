# U2.0 Local Smoke Test: Faster R-CNN R50-FPN v2 overfit 20 train frames + resume verification
run_id: "frcnn-smoke-local"
unit: "U2.0"
family: "faster_rcnn"
exp: "smoke"
parent_run: ""
hypothesis: "Verify Faster R-CNN training loop, AMP, warmup+cosine LR, and checkpoint resume on 20 cached frames."
seed: 42

cache: "k5_drop_L1920"
k: 5
imgsz: 640
min_size: 384
max_size: 640
num_classes: 9
trainable_backbone_layers: 3

max_train_images: 20
val_on_train: true
batch: 2
workers: 2
epochs: 6
time_budget_h: 0.15
optimizer: "sgd"
lr: 0.005
momentum: 0.9
weight_decay: 0.0001
warmup_epochs: 1.0
grad_clip_norm: 10.0

roi_box_loss: "giou"

augmentation:
  hflip: 0.0
  scale_min: 1.0
  scale_max: 1.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0

inference:
  conf_thresh: 0.001
  nms_iou: 0.6
  max_det: 500
  slim_conf_thresh: 0.05

