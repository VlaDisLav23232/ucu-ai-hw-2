# F1 Exp A (frcnn-e1): Dense RPN proposal budget & RoI positive sampling (§10 F1)
run_id: "frcnn-e1"
unit: "F1"
family: "faster_rcnn"
exp: "e1"
parent_run: "frcnn-e0"
hypothesis: "Doubling RPN pre/post-NMS proposals (4000/2000 train, 2000/2000 test) and expanding RoI batch size to 1024 (positive_fraction=0.33) with halved base anchor sizes (16..256 px) prevents RPN proposal starvation on crowded aerial frames."
seed: 42

cache: "k5_drop_L1920"
k: 5
imgsz: 1280
min_size: 720
max_size: 1280
num_classes: 9
trainable_backbone_layers: 3

batch: 4
workers: 4
epochs: 8
time_budget_h: 1.5
optimizer: "sgd"
lr: 0.005
momentum: 0.9
weight_decay: 0.0001
warmup_epochs: 1.0
grad_clip_norm: 10.0

rpn_pre_nms_top_n_train: 4000
rpn_pre_nms_top_n_test: 2000
rpn_post_nms_top_n_train: 2000
rpn_post_nms_top_n_test: 2000
box_batch_size_per_image: 1024
box_positive_fraction: 0.33
rpn_anchor_sizes:
  - [16]
  - [32]
  - [64]
  - [128]
  - [256]
roi_box_loss: "smooth_l1"

augmentation:
  hflip: 0.5
  scale_min: 0.5
  scale_max: 1.0
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3

inference:
  conf_thresh: 0.001
  nms_iou: 0.6
  max_det: 500
  slim_conf_thresh: 0.05

