# F2 Exp A (retina-e1): K-means (1 - IoU distance) anchors grounded in EDA (§10 F2)
run_id: "retina-e1"
unit: "F2"
family: "retinanet"
exp: "e1"
parent_run: "retina-e0"
hypothesis: "Replacing COCO default anchors (32..812 px, mean best IoU 0.648) with 1280-scale k-means anchors (10..109 px, mean best IoU 0.819, 9 anchors/location) increases positive anchor matches on small VisDrone objects."
seed: 42

cache: "k5_drop_L1920"
k: 5
imgsz: 1280
min_size: 720
max_size: 1280
num_classes: 9
trainable_backbone_layers: 3

batch: 4
workers: 4
epochs: 8
time_budget_h: 1.5
optimizer: "sgd"
lr: 0.005
momentum: 0.9
weight_decay: 0.0001
warmup_epochs: 1.0
grad_clip_norm: 10.0

topk_candidates: 1000
use_kmeans_anchors: true

augmentation:
  hflip: 0.5
  scale_min: 0.5
  scale_max: 1.0
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3

inference:
  conf_thresh: 0.001
  nms_iou: 0.6
  max_det: 500
  slim_conf_thresh: 0.05

