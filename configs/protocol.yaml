# Fixed Experimental Protocol P0 (§7 of PROJECT_BLUEPRINT.md)
# Changes to any parameter in this file require an entry in the Decision Log (§13).

protocol_id: "P0"
seed: 42

data:
  train_split: "train"
  holdout_split: "val"
  frame_step_k: 5
  val_proxy_k: 5
  ignore_policy: "drop"          # fixed by U1.2 ablation (Decision Log D-08)
  cache_long_side: 1920
  cache_name: "k5_drop_L1920"
  jpeg_quality: 95

input:
  imgsz: 1280                    # Ultralytics long side
  min_size: 720                  # torchvision min_size
  max_size: 1280                 # torchvision max_size

training:
  pretrained: "coco"
  time_budget_h: 1.5             # 1.5 GPU-h on a single T4 (includes in-training proxy val)
  warmup_epochs: 1.0
  close_mosaic_frac: 0.10        # close mosaic for final 10% of budget

augmentation:
  hflip: 0.5
  vflip: 0.0
  degrees: 0.0
  scale_min: 0.5                 # biased toward downscaling for test resolution shift (§2.5)
  scale_max: 1.0
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3

inference:
  conf_thresh: 0.001
  slim_conf_thresh: 0.05
  nms_iou: 0.6
  max_det: 500
  imgsz: 1280

evaluation:
  evaluator: "faster-coco-eval"
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  max_dets: [1, 10, 500]
  size_buckets:
    small: [0, 1024]             # < 32^2
    medium: [1024, 9216]         # 32^2 .. 96^2
    large: [9216, 10000000000]   # > 96^2

fps_benchmark:
  device: "cuda"
  batch_size: 1
  fp16: true
  imgsz: 1280
  warmup_frames: 20
  timed_frames: 200
  exclude_jpeg_decode: true

