# F4 Exp B (rtdetr-e2): Hungarian matching cost gains + Contrastive Denoising groups (§10 F4)
run_id: "rtdetr-e2"
unit: "F4"
family: "rtdetr"
exp: "e2"
parent_run: "rtdetr-e1"
hypothesis: "Re-weighting Hungarian bipartite matching toward spatial localization (bbox=7.5, giou=3.0, class=1.5 vs 5/2/2) and doubling denoising groups (100 -> 200) accelerates convergence on small aerial objects."
seed: 42

cache: "k5_drop_L1920"
k: 5
model: "configs/ultralytics_models/rtdetr-l-nq600.yaml"
pretrained_weights: "rtdetr-l.pt"
imgsz: 1280
batch: 4
epochs: 20
time_budget_h: 1.5
close_mosaic: 2
workers: 4

rtdetr_cost_gain:
  class: 1.5
  bbox: 7.5
  giou: 3.0
rtdetr_num_denoising: 200

augmentation:
  hflip: 0.5
  vflip: 0.0
  degrees: 0.0
  scale_min: 0.5
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3

inference:
  conf_thresh: 0.001
  nms_iou: 0.6
  max_det: 500
  slim_conf_thresh: 0.05

