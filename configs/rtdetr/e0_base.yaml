# F4 Baseline (rtdetr-e0): RT-DETR-L query-based detector under Protocol P0 (§7, §10 F4)
run_id: "rtdetr-e0"
unit: "F4"
family: "rtdetr"
exp: "e0"
parent_run: ""
hypothesis: "COCO-pretrained RT-DETR-L baseline (300 queries, imgsz=1280, AdamW, 1.5 GPU-h budget) removes heuristic NMS via bipartite Hungarian matching."
seed: 42

cache: "k5_drop_L1920"
k: 5
model: "rtdetr-l.pt"
imgsz: 1280
batch: 4
epochs: 20
time_budget_h: 1.5
close_mosaic: 2
workers: 4

augmentation:
  hflip: 0.5
  vflip: 0.0
  degrees: 0.0
  scale_min: 0.5
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3

inference:
  conf_thresh: 0.001
  nms_iou: 0.6
  max_det: 500
  slim_conf_thresh: 0.05

