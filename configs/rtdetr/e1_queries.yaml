# F4 Exp A (rtdetr-e1): Expanding decoder queries from 300 -> 600 for dense VisDrone scenes (§10 F4)
run_id: "rtdetr-e1"
unit: "F4"
family: "rtdetr"
exp: "e1"
parent_run: "rtdetr-e0"
hypothesis: "Increasing decoder object queries from nq=300 to nq=600 relieves top-k query bottleneck in dense aerial scenes (up to 180 objects/frame) and improves AR@500 and AP."
seed: 42

cache: "k5_drop_L1920"
k: 5
model: "configs/ultralytics_models/rtdetr-l-nq600.yaml"
pretrained_weights: "rtdetr-l.pt"
imgsz: 1280
batch: 4
epochs: 20
time_budget_h: 1.5
close_mosaic: 2
workers: 4

augmentation:
  hflip: 0.5
  vflip: 0.0
  degrees: 0.0
  scale_min: 0.5
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3

inference:
  conf_thresh: 0.001
  nms_iou: 0.6
  max_det: 500
  slim_conf_thresh: 0.05

