# F3 Exp A (yolo-e1): High-resolution input imgsz=1600 for small aerial objects (§10 F3)
run_id: "yolo-e1"
unit: "F3"
family: "yolo"
exp: "e1"
parent_run: "yolo-e0"
hypothesis: "Increasing input resolution from 1280 to 1600 (search range {1280, 1600}) increases small-object feature map density and boosts AP_small and overall AP."
seed: 42

cache: "k5_drop_L1920"
k: 5
model: "yolo11s.pt"
imgsz: 1600
batch: 4
epochs: 30
time_budget_h: 1.5
close_mosaic: 2
workers: 4

augmentation:
  hflip: 0.5
  vflip: 0.0
  degrees: 0.0
  scale_min: 0.5
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3

inference:
  conf_thresh: 0.001
  nms_iou: 0.6
  max_det: 500
  slim_conf_thresh: 0.05

